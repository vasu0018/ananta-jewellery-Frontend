<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>You're offline | Ananta Jewellery</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        text-align: center;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #231f1d;
        background: linear-gradient(135deg, #f9eeec 0%, #faf6f1 55%, #efe2cb 100%);
      }
      .brand { letter-spacing: 0.4em; font-size: 22px; margin: 0; }
      .sub { letter-spacing: 0.3em; font-size: 10px; color: #b38c55; margin: 4px 0 0; }
      h1 { font-family: Georgia, serif; font-weight: 400; font-size: 34px; margin: 32px 0 8px; }
      p.text { color: #776d67; max-width: 380px; margin: 0 auto; line-height: 1.6; }
      button {
        margin-top: 24px; height: 44px; padding: 0 28px; border: 0; border-radius: 999px;
        background: #231f1d; color: #fff; font-size: 14px; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">ANANTA</p>
      <p class="sub">JEWELLERY</p>
      <h1>You're offline</h1>
      <p class="text">Check your internet connection and try again. Your bag and wishlist are saved on this device.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
